name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: build
        run: forge build --root contracts --sizes
      - name: test
        run: FOUNDRY_PROFILE=ci forge test --root contracts -vvv
      - name: fmt
        run: forge fmt --root contracts --check

  typescript:
    name: typescript (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  fork:
    name: mainnet fork replay
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: fork tests (skipped without an RPC secret)
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "no BASE_RPC_URL secret; skipping"; exit 0; fi
          forge test --root contracts --match-path "test/fork/*" --fork-url "$BASE_RPC_URL" -vvv
